<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aftellen naar Turkije</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:
      linear-gradient(180deg, rgba(0,40,60,0.55) 0%, rgba(0,40,60,0.75) 100%),
      url('https://dreamworldhill.com.tr/assets/images/Dream_World_Hill_Family_Club_Beach_2.webp') center center / cover no-repeat;
    color: white;
  }
  .card {
    text-align: center;
    padding: clamp(24px, 6vw, 40px);
    max-width: 480px;
    width: 100%;
  }
  .plane {
    font-size: clamp(48px, 10vw, 64px);
    margin-bottom: 16px;
  }
  h1 {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    margin: 0 0 8px 0;
  }
  .sub {
    font-size: clamp(13px, 3.2vw, 16px);
    opacity: 0.9;
    margin-bottom: 32px;
  }
  .timer {
    display: flex;
    justify-content: center;
    gap: clamp(8px, 2.5vw, 14px);
    flex-wrap: wrap;
  }
  .box {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(6px);
    border-radius: 16px;
    padding: clamp(14px, 4vw, 20px) clamp(10px, 3vw, 16px);
    min-width: 68px;
    flex: 1 1 0;
  }
  .num {
    font-size: clamp(24px, 6vw, 36px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: clamp(10px, 2.5vw, 12px);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.9;
    margin-top: 6px;
  }
  .footer {
    margin-top: 28px;
    font-size: clamp(13px, 3vw, 15px);
    opacity: 0.9;
    line-height: 1.6;
  }
  .done {
    font-size: clamp(20px, 6vw, 28px);
    font-weight: 700;
  }
  .gallery-link {
    display: inline-block;
    margin-top: 20px;
    color: white;
    text-decoration: underline;
    font-size: clamp(13px, 3.5vw, 16px);
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="plane">✈️🇹🇷</div>
      <h1>Op naar Side, Turkije!</h1>
      <div class="sub">Vertrek 18 september 2026 · 10:25 vanaf Eindhoven</div>
      <div class="timer" id="timer"></div>
      <div class="footer" id="footer">Dream World Hill · All inclusive · 9 dagen</div>
      <div>
        <a class="gallery-link" href="https://dreamworldhill.com.tr/en/gallery" target="_blank" rel="noopener">Bekijk foto's van het hotel →</a>
      </div>
      <div>
        <a class="gallery-link" href="inpakchecklist.html">📋 Inpakchecklist</a>
      </div>
    </div>
  </div>

<script>
  const target = new Date("2026-09-18T10:25:00+02:00").getTime();
  const timerEl = document.getElementById('timer');
  const footerEl = document.getElementById('footer');

  function render() {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) {
      timerEl.innerHTML = '<div class="done">Goede reis! 🌴</div>';
      footerEl.textContent = 'Dream World Hill · All inclusive · 9 dagen';
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    const parts = [
      { v: days, l: 'dagen' },
      { v: hours, l: 'uren' },
      { v: minutes, l: 'min' },
      { v: seconds, l: 'sec' }
    ];

    timerEl.innerHTML = parts.map(p =>
      `<div class="box"><div class="num">${String(p.v).padStart(2,'0')}</div><div class="label">${p.l}</div></div>`
    ).join('');
  }

  render();
  setInterval(render, 1000);
</script>
</body>
</html>
