<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Aftellen naar Turkije</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0093E9 0%, #80D0C7 100%);
    color: white;
  }
  .card {
    text-align: center;
    padding: 40px 30px;
    max-width: 420px;
    width: 100%;
  }
  .plane {
    font-size: 48px;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .sub {
    font-size: 14px;
    opacity: 0.85;
    margin-bottom: 28px;
  }
  .timer {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .box {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(6px);
    border-radius: 16px;
    padding: 16px 14px;
    min-width: 68px;
  }
  .num {
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.85;
    margin-top: 4px;
  }
  .footer {
    margin-top: 28px;
    font-size: 13px;
    opacity: 0.85;
    line-height: 1.6;
  }
  .done {
    font-size: 20px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="plane">✈️🇹🇷</div>
    <h1>Op naar Side, Turkije!</h1>
    <div class="sub">Vertrek 18 september 2026 · 10:25 vanaf Eindhoven</div>
    <div class="timer" id="timer"></div>
    <div class="footer" id="footer">Dream World Hill · All inclusive · 9 dagen</div>
  </div>

<script>
  const target = new Date("2026-09-18T10:25:00+02:00").getTime();
  const timerEl = document.getElementById('timer');
  const footerEl = document.getElementById('footer');

  function render() {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) {
      timerEl.innerHTML = '<div class="done">Goede reis! 🌴</div>';
      footerEl.textContent = 'Dream World Hill · All inclusive · 9 dagen';
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    const parts = [
      { v: days, l: 'dagen' },
      { v: hours, l: 'uren' },
      { v: minutes, l: 'min' },
      { v: seconds, l: 'sec' }
    ];

    timerEl.innerHTML = parts.map(p =>
      `<div class="box"><div class="num">${String(p.v).padStart(2,'0')}</div><div class="label">${p.l}</div></div>`
    ).join('');
  }

  render();
  setInterval(render, 1000);
</script>
</body>
</html>
